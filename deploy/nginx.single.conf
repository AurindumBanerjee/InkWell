# One public origin for a single-node instance: the browser talks to nginx only.
#   /api/*  -> API   (prefix stripped, so the API's own routes are unchanged)
#   /ws/*   -> API   (WebSockets: document sync and, in the AI version, /ws/ai)
#   /*      -> web   (Next.js)
# TLS is expected to terminate in front of this (the hosting platform or a load balancer).
worker_processes 1;
events { worker_connections 4096; }

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80;
    client_max_body_size 2m;

    location /api/ {
      proxy_pass http://server:4000/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /ws/ {
      proxy_pass http://server:4000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 3600s;
    }

    location / {
      proxy_pass http://web:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
  }
}
