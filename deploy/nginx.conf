# Front door for the local sync cluster (docker-compose.cluster.yml).
#
# WebSockets are routed by DOCUMENT, not by client: `hash $uri consistent` maps /ws/docs/<id> to the
# same node for every client, so in steady state all editors of a document share one in-memory room
# and cross-node traffic (Redis) is idle. If a node dies, nginx re-hashes just that node's documents
# to the survivors; Redis + the join/reconnect resync keep any split rooms consistent meanwhile.
# See docs/adr/0005-horizontal-scaling.md.
worker_processes 1;
# Every proxied WebSocket costs two connections here (client side + node side).
worker_rlimit_nofile 32768;
events {
  worker_connections 16384;
}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream api_nodes {
    least_conn;
    server server-a:4000 max_fails=2 fail_timeout=5s;
    server server-b:4000 max_fails=2 fail_timeout=5s;
    server server-c:4000 max_fails=2 fail_timeout=5s;
  }

  upstream ws_nodes {
    hash $uri consistent;
    server server-a:4000 max_fails=2 fail_timeout=5s;
    server server-b:4000 max_fails=2 fail_timeout=5s;
    server server-c:4000 max_fails=2 fail_timeout=5s;
  }

  server {
    listen 80;

    location /ws/ {
      proxy_pass http://ws_nodes;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 3600s;
      proxy_next_upstream error timeout;
    }

    # Sessions live in Postgres, so any node can serve REST calls.
    location / {
      proxy_pass http://api_nodes;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
