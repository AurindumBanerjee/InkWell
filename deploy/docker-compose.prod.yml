# One Inkwell instance on one host (single sync node, no Redis needed).
#
#   docker compose --env-file deploy/instances/normal.env -f deploy/docker-compose.prod.yml up -d --build
#   docker compose --env-file deploy/instances/ai.env     -f deploy/docker-compose.prod.yml up -d --build
#
# The same file serves both versions of the app: everything that differs (names, ports, URLs,
# database, feature flags, keys) comes from the instance env file. The compose project name is
# derived from INSTANCE, so two instances never share containers, networks or volumes.
# Real env files hold secrets and are git-ignored; commit only the *.env.example templates.
name: inkwell-${INSTANCE:?set INSTANCE (normal or ai) in the instance env file}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      retries: 20

  server:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    image: inkwell-server:${INSTANCE}
    restart: unless-stopped
    env_file: ${INSTANCE_ENV_FILE:-instances/${INSTANCE}.env}
    environment:
      NODE_ENV: production
      PORT: '4000'
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ENABLE_DEV_LOGIN: 'false'
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 10s
      retries: 6

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_AI_FEATURES: ${NEXT_PUBLIC_AI_FEATURES:-false}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:?}
        NEXT_PUBLIC_DEV_LOGIN: 'false'
    image: inkwell-web:${INSTANCE}
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes: ['./nginx.single.conf:/etc/nginx/nginx.conf:ro']
    ports: ['${HTTP_PORT:-8080}:80']
    depends_on: [server, web]

volumes:
  pgdata:
